name: Institutional Data Pipeline

on:
  schedule:
    - cron: '30 18 * * *' # Automatically runs every night at 12:00 AM IST (18:30 UTC)
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Optional manual token override'
        required: false
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests pandas numpy py_vollib py_vollib_vectorized google-api-python-client google-auth

    - name: Run Pipeline Script & Sync to Drive
      env:
        UPSTOX_ACCESS_TOKEN: ${{ github.event.inputs.access_token != '' && github.event.inputs.access_token || secrets.UPSTOX_ACCESS_TOKEN }}
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        python pipeline.py
