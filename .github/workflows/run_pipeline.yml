name: Institutional Data Pipeline

on:
  workflow_dispatch:
  schedule:
    # 20:17 UTC = 01:47 AM IST (Runs Tuesday to Saturday morning)
    - cron: '17 20 * * 1-5'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy py_vollib py_vollib_vectorized upstox-client

      - name: Run Pipeline Script (with Auto-Retries)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          max_retries=3
          count=0
          
          until python pipeline.py; do
            exit_code=$?
            count=$((count + 1))
            if [ $count -ge $max_retries ]; then
              echo "🚨 Pipeline completely failed after $max_retries attempts."
              exit $exit_code
            fi
            echo "⚠️ Pipeline failed. Retrying in 2 minutes... (Attempt $count of $max_retries)"
            sleep 120
          done

      - name: Zip Data for Telegram
        run: |
          LATEST_FOLDER=$(ls -td output_data/*/ | head -1 | sed 's/\/$//')
          TARGET_DATE=$(basename "$LATEST_FOLDER")
          
          echo "Target trading date detected as: $TARGET_DATE"
          zip -r "Market_Data_$TARGET_DATE.zip" "output_data/$TARGET_DATE/"
          
          echo "ZIP_FILE=Market_Data_$TARGET_DATE.zip" >> $GITHUB_ENV
          echo "TARGET_DATE=$TARGET_DATE" >> $GITHUB_ENV

      - name: Send Consolidated Archive to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION="📊 Complete Institutional Market Data Archive for ${{ env.TARGET_DATE }} (NSE, BSE, MCX, Nifty 200 F&O & ETFs) - Pipeline Completed ✅"
          
          curl -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@"${{ env.ZIP_FILE }}" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

      - name: Commit and Push Data to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_data/
          git commit -m "Auto-archive institutional dataset for daily run" || echo "No new data to commit"
          git push
