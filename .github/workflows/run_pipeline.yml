name: Institutional Data Pipeline

on:
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Paste Today Upstox Access Token Here'
        required: true
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
      python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests pandas numpy py_vollib py_vollib_vectorized

    - name: Run Pipeline Script
      env:
        UPSTOX_ACCESS_TOKEN: ${{ github.event.inputs.access_token }}
      run: |
        python pipeline.py

    - name: Upload Data Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trading-data-${{ github.run_id }}
        path: Institutional_Master_Archive_*/
