name: Institutional Data Pipeline

on:
  workflow_dispatch:
  schedule:
    # 20:00 UTC = 01:30 AM IST (Runs Tuesday to Saturday morning)
    - cron: '0 20 * * 1-5'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy py_vollib py_vollib_vectorized

      - name: Run Pipeline Script (with Auto-Retries)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          max_retries=3
          count=0
          
          until python pipeline.py; do
            exit_code=$?
            count=$((count + 1))
            if [ $count -ge $max_retries ]; then
              echo "🚨 Pipeline completely failed after $max_retries attempts."
              exit $exit_code
            fi
            echo "⚠️ Pipeline failed (Upstox timeout/error). Retrying in 2 minutes... (Attempt $count of $max_retries)"
            sleep 120
          done

      - name: Zip Data for Telegram
        run: |
          DATE_STR=$(date +'%Y-%m-%d')
          # Zip only today's specific dated subfolder
          zip -r "Market_Data_$DATE_STR.zip" output_data/$DATE_STR/

      - name: Send Consolidated Archive to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE_STR=$(date +'%Y-%m-%d')
          FILE_NAME="Market_Data_$DATE_STR.zip"
          CAPTION="📊 Complete Market Data Archive for $DATE_STR (NSE & MCX) - Pipeline Completed ✅"
          
          curl -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@"$FILE_NAME" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

      - name: Commit and Push Data to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_data/
          git commit -m "Auto-archive institutional dataset for daily run" || echo "No new data to commit"
          git push
