name: Institutional Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy py_vollib py_vollib_vectorized

      - name: Run Pipeline Script
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py

      - name: Upload Output Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-data-archive
          path: output_data/
